name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Test GitData package
        run: |
          swift package --package-path Packages/GitData clean
          swift test --package-path Packages/GitData

      - name: Test Presenters package
        if: ${{ !cancelled() }}
        run: |
          swift package --package-path Packages/Presenters clean
          swift test --package-path Packages/Presenters

      - name: Build app
        # Runs even if a test step failed, so one CI run reports both kinds of breakage.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail && xcodebuild build \
            -workspace Elemental.xcworkspace \
            -scheme Elemental \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Check updater is bundled
        if: ${{ !cancelled() }}
        run: |
          APP=build/Build/Products/Debug/Elemental.app
          # A package framework that isn't embedded still compiles, then crashes at launch.
          test -d "$APP/Contents/Frameworks/Sparkle.framework" \
            || { echo "::error::Sparkle.framework is not embedded in Elemental.app"; exit 1; }
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$PLIST"
          # Manual-only updates: the app must never check on its own unless the user opts in.
          [ "$(/usr/libexec/PlistBuddy -c "Print :SUEnableAutomaticChecks" "$PLIST")" = "false" ] \
            || { echo "::error::SUEnableAutomaticChecks must be false"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Test appcast generator
        if: ${{ !cancelled() }}
        run: python3 scripts/make-appcast.py --self-test
